name: Release

# v1.2.3         -> web + android + ios
# v1.2.3-web     -> web only
# v1.2.3-android -> android only
# v1.2.3-ios     -> ios only
on:
  push:
    tags:
      - 'v*'

jobs:
  deploy-web:
    if: ${{ !endsWith(github.ref_name, '-android') && !endsWith(github.ref_name, '-ios') }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test --testPathIgnorePatterns='utils/dateUtils.test.js' # standalone script, see AGENTS.md
      - run: pnpm build:web

      - name: Create Cloudflare Pages project if missing
        run: pnpm dlx wrangler pages project create roti --production-branch=main || echo "project already exists, skipping"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=roti --branch=main

  build-android:
    if: ${{ !endsWith(github.ref_name, '-web') && !endsWith(github.ref_name, '-ios') }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Prebuild and Build Android APK
        run: pnpm exec expo prebuild --platform android --no-install && cd android && ./gradlew assembleRelease

      - name: Rename APK
        run: mv android/app/build/outputs/apk/release/app-release.apk RoutineTracker-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Routine Tracker: ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: RoutineTracker-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

  # ponytail: unsigned simulator build; a device .ipa needs Apple certs/profiles (or EAS).
  build-ios:
    if: ${{ !endsWith(github.ref_name, '-web') && !endsWith(github.ref_name, '-android') }}
    runs-on: macos-latest
    environment: dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prebuild iOS (also runs pod install)
        run: pnpm exec expo prebuild --platform ios

      - name: Build simulator app
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent "ios/build/Build/Products/Release-iphonesimulator/$SCHEME.app" \
            RoutineTracker-${{ github.ref_name }}-ios-simulator.zip

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: RoutineTracker-${{ github.ref_name }}-ios-simulator.zip
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
